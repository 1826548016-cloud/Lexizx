{% load static %}
<!-- ===== AI 模型配置独立窗口（API 填写）=====
     全局可用：AI 单词导入 / 设置 / 小助手等页面均可通过 openAddModel() 打开。
     配置统一存入数据库 AIModel 表，由后端 resolve_ai_model 读取。 -->
<div id="addModelModal" class="modal-overlay hidden" onclick="if (event.target === this) closeAddModel()">
  <div class="modal" style="max-width: 520px;">
    <input type="hidden" id="amEditId" value="">
    <div class="flex justify-between items-center" style="margin-bottom: 16px;">
      <h3 id="amModalTitle" style="margin: 0; font-size: var(--fs-lg);"><i class="ph ph-plus" style="color: var(--c-green);"></i> 添加模型</h3>
      <button class="btn btn-ghost" onclick="closeAddModel()" title="关闭"><i class="ph ph-x"></i></button>
    </div>

    <div class="form-group">
      <label class="form-label">模型服务商</label>
      <select id="amProvider" class="form-input" onchange="changeAMProvider()"></select>
    </div>

    <div class="form-group">
      <label class="form-label">模型</label>
      <select id="amModelPreset" class="form-input" onchange="onAMPresetChange()"></select>
      <div id="amCustomModelWrap" class="hidden" style="margin-top: 8px;">
        <input type="text" id="amModelId" class="form-input" placeholder="输入模型 ID，如 gpt-4o">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">API 格式</label>
      <div class="form-input" style="background: var(--c-bg); color: var(--c-text-3); cursor: default;">OpenAI Chat Completions 格式（兼容 /v1/chat/completions）</div>
    </div>

    <div class="form-group">
      <label class="form-label">API 密钥 <span class="text-secondary" style="font-weight: normal;">（本机服务可留空）</span> <a href="https://platform.openai.com/api-keys" target="_blank" class="text-sm" style="color: var(--c-green); margin-left: 6px;">获取 API 密钥 →</a></label>
      <div class="ai-key-wrap">
        <input type="password" id="amApiKey" class="form-input" placeholder="sk-...（无鉴权服务可不填）" autocomplete="off">
        <button type="button" class="ai-key-toggle" id="amKeyToggle" onclick="toggleAMKeyVisible()" title="显示/隐藏密钥"><i class="ph ph-eye"></i></button>
      </div>
    </div>

    <div class="form-group">
      <div class="flex justify-between items-center">
        <label class="form-label" style="margin: 0;">自定义请求地址 <span class="text-secondary" style="font-weight: normal;">（可选）</span></label>
        <div class="flex items-center gap-2">
          <span class="text-sm text-secondary">完整 URL</span>
          <label class="switch"><input type="checkbox" id="amFullUrl" onchange="onAMFullUrlChange()"><span class="slider"></span></label>
        </div>
      </div>
      <input type="text" id="amBaseUrl" class="form-input" placeholder="https://api.openai.com/v1">
      <div id="amUrlHint" class="text-sm text-secondary" style="margin-top: 4px;">关闭：填基础地址，自动拼接 /chat/completions；打开：直接填完整请求地址，如 http://localhost:4096/v1/chat/completions</div>
    </div>

    <div class="form-group">
      <button type="button" class="text-sm" style="background:none;border:none;color:var(--c-text-3);cursor:pointer;padding:0;" onclick="toggleAMAdvanced()">
        <i class="ph ph-caret-right" id="amAdvCaret"></i> 高级配置
      </button>
      <div id="amAdvanced" class="hidden grid grid-2" style="margin-top: 8px; gap: 8px;">
        <div>
          <label class="form-label">模型展示名称</label>
          <input type="text" id="amDisplayName" class="form-input" placeholder="留空默认显示模型 ID">
        </div>
        <div>
          <label class="form-label">上下文窗口</label>
          <select id="amContext" class="form-input">
            <option value="32K">32K</option>
            <option value="128K" selected>128K</option>
            <option value="256K">256K</option>
            <option value="1M">1M</option>
          </select>
        </div>
      </div>
    </div>

    <div id="amTestResult" class="ai-test-result" style="margin: 8px 0;"></div>

    <div class="flex gap-2 justify-end">
      <button class="btn btn-secondary" onclick="closeAddModel()">取消</button>
      <button class="btn btn-secondary" id="amTestOnlyBtn" onclick="testAMConnection()" title="只验证连接，不保存配置"><i class="ph ph-plugs-connected"></i> 测试连接</button>
      <button class="btn btn-primary" id="amSubmitBtn" onclick="submitAddModel()"><i class="ph ph-check"></i> 添加模型</button>
    </div>
  </div>
</div>
