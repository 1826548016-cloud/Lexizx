<!-- 笔记 / 速记 展开区（不弹窗，直接显示在卡片下方，卡片自动放大） -->
<div id="wordExtPanel" class="word-ext-panel hidden">
  <!-- 笔记面板 -->
  <div id="notePanel" class="hidden">
    <div class="ext-bar-note"></div>
    <div class="ext-header">
      <div class="ext-header-title"><i class="ph ph-note-pencil" style="color: var(--c-green);"></i> 笔记<span id="noteWordTitle" class="ext-word"></span></div>
      <button class="ext-close-btn" onclick="WordExtPanel.closeExtPanel()" title="收起"><i class="ph ph-x" style="font-size: 18px;"></i></button>
    </div>
    <div class="ext-body">
      <div id="noteMeta" class="ext-meta"><i class="ph ph-spinner gap" style="font-size: 14px;"></i> 加载中…</div>
      <div class="note-paper">
        <textarea id="noteContent" rows="4" placeholder="记录这个单词的记忆方法、例句、易错点…"></textarea>
      </div>
      <div class="ext-actions">
        <input id="notePage" class="ext-page-input" type="number" placeholder="页码" style="width: 90px;">
        <button id="noteDeleteBtn" class="ext-pill ext-pill-danger hidden" onclick="WordExtPanel.deleteNote()"><i class="ph ph-trash"></i> 删除</button>
        <span style="flex: 1;"></span>
        <button class="ext-pill ext-pill-primary" onclick="WordExtPanel.saveNote()"><i class="ph ph-check"></i> 保存笔记</button>
      </div>
    </div>
  </div>

  <!-- 速记面板 -->
  <div id="qmPanel" class="hidden">
    <div class="ext-bar-quick"></div>
    <div class="ext-header">
      <div class="ext-header-title"><i class="ph ph-lightning" style="color: var(--c-amber);"></i> 速记<span id="qmWordTitle" class="ext-word"></span></div>
      <button class="ext-close-btn" onclick="WordExtPanel.closeExtPanel()" title="收起"><i class="ph ph-x" style="font-size: 18px;"></i></button>
    </div>
    <div class="ext-body">
      <div id="qmMeta" class="ext-meta"><i class="ph ph-spinner gap" style="font-size: 14px;"></i> 加载中…</div>
      <div id="qmDeck" class="qm-deck">
        <textarea id="qmContent" rows="10" placeholder="点击「生成速记」让 AI 为你创作，或直接手动输入。"></textarea>
      </div>
      <div class="ext-actions">
        <button id="qmGenerateBtn" class="ext-pill ext-pill-amber hidden" onclick="WordExtPanel.generateQuickMemory(false)"><i class="ph ph-magic-wand"></i> 生成速记</button>
        <button id="qmRegenBtn" class="ext-pill ext-pill-amber hidden" onclick="WordExtPanel.generateQuickMemory(true)" title="重新调用 AI 生成（会覆盖当前内容）"><i class="ph ph-arrows-clockwise"></i> 重新生成</button>
        <button id="qmDeleteBtn" class="ext-pill ext-pill-danger hidden" onclick="WordExtPanel.deleteQuickMemory()"><i class="ph ph-trash"></i> 删除</button>
        <span style="flex: 1;"></span>
        <button class="ext-pill ext-pill-primary" onclick="WordExtPanel.saveQuickMemory()"><i class="ph ph-check"></i> 保存</button>
      </div>
    </div>
  </div>
</div>
