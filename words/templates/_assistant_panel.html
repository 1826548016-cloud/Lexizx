<style>
  /* 小助手浮动按钮（背诵/复习通用，右下角） */
      
  /* 小助手聊天面板 */
    
    
        
  /* AI 回答 Markdown 排版 */
                
  
      
  @media (max-width: 768px) {
    .assistant-fab { bottom: 84px; right: 16px; width: 50px; height: 50px; padding: 0; justify-content: center; border-radius: 50%; }
    .assistant-fab span { display: none; }
    .assistant-panel { bottom: 148px; right: 16px; left: 16px; width: auto; }
  }
</style>

<!-- 小助手聊天面板（背诵/复习共用，对话历史互通） -->
<div id="assistantPanel" class="assistant-panel hidden">
  <div class="assistant-header">
    <div class="assistant-header-title">
      <i class="ph ph-chat-circle-text" style="color: var(--c-green);"></i> 小助手
    </div>
    <div style="display: flex; gap: 4px;">
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.clearHistory()" title="清空对话记录"><i class="ph ph-trash"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="AssistantPanel.close()" title="收起 (ESC)"><i class="ph ph-x"></i></button>
    </div>
  </div>
  <div id="assistantBody" class="assistant-body">
    <div class="assistant-empty">加载对话记录…</div>
  </div>
  <div class="assistant-actions">
    <button id="assistantAskWordBtn" class="btn btn-secondary btn-sm" onclick="AssistantPanel.askCurrentWord()"><i class="ph ph-lightbulb"></i> 问当前单词考法</button>
  </div>
  <div class="assistant-input-row">
    <textarea id="assistantInput" class="form-input" rows="1" placeholder="随便问点什么…（Enter 发送）"></textarea>
    <button id="assistantSendBtn" class="btn btn-primary" onclick="AssistantPanel.sendFromInput()" title="发送"><i class="ph ph-paper-plane-tilt"></i></button>
  </div>
</div>

<button id="assistantFab" class="assistant-fab" onclick="AssistantPanel.toggle()" title="小助手">
  <i class="ph ph-chat-circle-text" style="font-size: 1.3rem;"></i> <span>小助手</span>
</button>
